# =============================================================================
# Simulation Configuration File (config/sim.yaml)
# -----------------------------------------------------------------------------
# Purpose: adjust any simulation settings here
# Notes:
#  - variables and variable values should generally be lowercase (e.g., 'false' or 'null')
#  - anything in all caps is meant to be a backup parameter which should not be needed if other inputs are defined properly (i.e., these most likely will not need to be updated by most users)
#  - use &<reusable_params> to create reusable blocks and *<reusable_params> to reference that block elsewhere
# =============================================================================



# =============================================================================
# Simulation Duration Parameters
# -----------------------------------------------------------------------------
# NOTE: all time-related parameters should always be specified in seconds (regardless of data resolution)
simulation_time: 2050 # seconds
action_interval: 10 #seconds
time_step: 1.0 # seconds
data_resolution: 1.0 # this is the time resolution of the data being used in seconds (e.g., if using minute-level data, set this to 60; if using second-level data, set this to 1, if data is provided for every 15 seconds or quarter of a minute, set this to 15 or 0.25*60, etc.)
start_time: 0
warmup_time: 50 # recommended 50 seconds at second scale or 3000 seconds (=50 minutes) at the minute scale
# if DER devices are active, need warmup period to allow device injections to stabilize, set to 0 if not needed
# if a specific simulation duration is needed, then increase simulation_time by the warmup_time value
# if a specific start time is needed, then decrease start_time by the warmup_time value
# e.g. with a warmup_time of 50 seconds, if you want to use data from time 125-325 seconds for a 200 second simulation:
# start_time = desired_start_time - warmup_time = 125 - 50 = 75 seconds
# simulation_time = desired_simulation_duration + warmup_time = 200 + 50 = 250 seconds
# this means the simulation will run from 75-325 seconds, but since warmup_time = 50, the first 50 values will be discarded for plotting and evaluation purposes, leaving results from the desired 125-325 timeframe
test_real_time: false #set to true to track real-time performance of the simulation - note that  results when using real-time mode versus standard HELICS time management
real_time_mode: false #set to true to use HELICS real-time mode, set to false to use HELICS time management (note that real-time mode can only slow down the simulation to match real-time, it cannot speed up the simulation if it is too slow to match real-time performance)
real_time_lag: 0.2 # how far behind wall-clock time the simulation is allowed to fall (seconds)
real_time_lead: 0.0 # how far ahead of wall-clock time the simulation is allowed to run in seconds (recommended to keep at 0 to keep simulation from running ahead)
# =============================================================================



# =============================================================================
# Power Flow Parameters
# -----------------------------------------------------------------------------
# data_folder indicates which network you would like to model; see PyMAGIC/inputs/data for available networks
data_folder: "pymagic_input"
# data_folder: "ieee37"

load_scaling_factor: 1.0
load_constant_PF: true #set this to false for constant reactive power demand
load_power_factor: 0.98
# default power factor is lagging (i.e., inductive load), for a leading (i.e., capacitive) load, set power_factor to a negative value
# =============================================================================



# =============================================================================
# Smart-DS Data Loading Parameters
# -----------------------------------------------------------------------------
# Notes:
#   - run prepare_smart_ds_data.py to download the SMART-DS data specified by the parameters below BEFORE running the simulation
#   - if using the SMART-DS dataset, the data_folder should be set to the name of the folder that is generated by prepare_smart_ds_data.py
#   - this data pre-loading step is only required for the SMART-DS dataset, other datasets (e.g., IEEE test feeders) do not require this step and are ready to use as is
smart_ds_folder: # this field is only used to generate the smart-ds folder (this will download an opendss file from the SMART-DS dataset based on the specified parameters below, note that the data loading may take a few minutes due to the size of the SMART-DS dataset
# original link from:  https://data.openei.org/s3_viewer?bucket=oedi-data-lake&prefix=SMART-DS%2Fv1.0%2F2018%2FGSO%2Frural%2Fscenarios%2Fsolar_low_batteries_low_timeseries%2Fopendss_no_loadshapes%2Frhs2_1247%2Frhs2_1247--rdt1264%2F&limit=50
# data loading procedure from: ***** [ Code based on UCF repo: https://github.com/Sandymiguel137/State_Estimation_and_Denoising ] ***** 
  year: "2018"
  region: "GSO"
  location_type: "rural"
  scenario: "solar_low_batteries_low_timeseries"
  substation: "rhs2_1247"
  feeder: "rhs2_1247--rdt1264"
  use_smartds_timeseries: false #redirects to ...<scenario>/opendss_no_loadshapes/<substation>/<feeder>/ if false, otherwise ...<scenario>/opendss/<substation>/<feeder>/
sim_start_timestamp: "2018-06-19 05:16:00" # string formatted as "YYYY-MM-DD HH:MM:SS" - this is the DESIRED start time for the simulation, update this value and run smart_ds_timestamp_to_index.py to find the corresponding start_time value (in seconds) for the simulation, replace start_tiem with this value

truncate_smart_ds_data: true # set to true to only use a portion of the SMART-DS data (this is helpful for testing purposes and debugging, and can be set to false to use the full dataset for training and evaluation)
data_start_time: "2018-01-01 00:00:00" # string formatted as "YYYY-MM-DD HH:MM:SS" - this is the start time of the original data set without truncation
truncation_start_time: "2018-06-19 00:00:00" # string formatted as "YYYY-MM-DD HH:MM:SS" - this is the time that you would like your prepared data to start at (this will be the first time step of the truncated data set if truncation is enabled)
truncation_end_time: "2018-06-20 00:00:00"  # string formatted as "YYYY-MM-DD HH:MM:SS"  - this is the time that you would like your prepared data to end at (this will be the last time step of the truncated data set if truncation is enabled)
 # if a truncation start and end time are not specified, then the truncation will default to the first <truncated_data_length> time steps of the original data set (starting from the beginning of the time series) if truncate_smart_ds_data is true
truncated_data_length: 10000 #number of time steps to keep if truncating the SMART-DS data (only used if truncate_smart_ds_data is true), note that this will start from the beginning of the time series by default (set truncation_start_time and truncation_end_time to null to use this feature)
# =============================================================================



# =============================================================================
# DER Device Data Handling
# -----------------------------------------------------------------------------
device_defaults: &device_default
# default data handling (feel free to update for device classes as needed)
  scaling_factor: 1.0
  sbar_scaling_factor: 1.0 # apparent power values in the IEEE folders have already been scaled to be greated than max generation (assuming solar profile was not scaled), only scale more if needed
  device_active: false
  device_random: false # set to false for reproducible device behavior across runs

# default VVVW inverter settings (feel free to update for device classes as needed)
  vvvw_active: true #determines if batteries use VVVW or not (VVVW is used by default for any PV inverters)
  voltage_lowpass_filter_mean: 1.2
  voltage_lowpass_filter_std: 0.1 # recommended ~0.1
  setpoint_lowpass_filter_mean: 0.1 #larger values = faster response, smaller values = slower response
  setpoint_lowpass_filter_std: 0.01 # recommended ~0.08, high values can cause instability
  VVVW_BREAKPOINTS: 
    - [0.98, 1.01, 1.02, 1.05, 1.07]


  # VVVW breakpoint generation parameters (only used if randomly generating breakpoints instead of using pre-exsiting breakpoint data)
  # number of breakpoints to generate for a feeder are determined by the number of inverters on that feeder (i.e. PV_data.csv and/or BSD_data.csv must be present in the data folder before trying to generate breakpoints)
  # *** specify the slopes as a magnitude (i.e. specify a positive value even though the slopes are negative for both volt-VAR and volt-watt) ***
  # BSD curves are typically allows to be steeper than PV curves
  min_VV_slope: 15
  max_VV_slope: 20 # randomly sampled according to uniform distribution
  min_VW_slope: 12 # note that the volt-watt curve is typically less steep than the volt-VAR curve, so the volt-watt slope will be forced to be less than or equal to the volt-VAR slope when generating breakpoints
  max_VW_slope: 18 # randomly sampled according to uniform distribution
  use_deadband: true # only used when generating a single set of breakpoints at a time (mostly for testing purposes)
  percent_with_deadband: 0.80 # the percentage of the inverters that should have a deadband in the volt-VAR curve (it is very common for inverters to have a deadband, so this value should typically be set to at least 0.5 or higher)
  min_deadband_width: 0.03 # min and max values for the width of the deadband (i.e., the flat portion of the volt-VAR curve where no reactive power is injected regardless of voltage)
  max_deadband_width: 0.05 # randomly sampled according to uniform distribution
  min_nominal_voltage: 0.995 # range for nominal voltage to be randomly assigned to inverters when generating breakpoints (in per unit), typically between 0.995 and 1.005 p.u. (this represents the center of the volt-VAR curve - keep it closely centered around 1.0)
  max_nominal_voltage: 1.005 # randomly sampled according to normal distribution
  random_seed: 42 # optional - random seed for reproducibility when generating breakpoints (set to null to generate randomized breakpoints each time breakpoints are created)


# device specific changes
device_classes:
  PV: 
    <<: *device_default
    device_active: true
    solar_min_value: 0.1 # minimum solar insolation [kW] needed for volt-watt (volt-VAR will still be applied)
  BSD: # !!!!!!!!!!! ensure that battery data is available for the selected data folder if setting this to active !!!!!!!!!!! 
    <<: *device_default
    device_active: false
    constant_PF: true
    power_factor: 0.98 # power factor used to compute Q setpoints based on P setpoints when relyinhg on local controller (when VVVW is turned off)
    reactive_ramp_rate_scaling_factor: 1.5 # scaling factor applied to the battery's charging and discharging ramp rates (Q is allowed to ramp faster than P); typically between 1-2
    setpoint_lowpass_filter_mean: 0.7 #battery setpoints may need to respond faster than PV inverters
    setpoint_lowpass_filter_std: 0.015

    # set steeper curves for BSD
    min_VV_slope: 10
    max_VV_slope: 20
    min_VW_slope: 8
    max_VW_slope: 15
    
    # default values to use when battery parameters are not explicitly defined
    # note that negative values here mean the battery is charging and positive values mean the battery is discharging
    defaults:
      INITIAL_SOC: 0.5
      CONSTANT_CHARGE_RATE: -5
      CONSTANT_DISCHARGE_RATE: 10
      ENERGY_CAPACITY: 150
      CHARGING_EFFICIENCY: 0.98
      DISCHARGING_EFFICIENCY: 0.98
      MIN_SOC: 0.2
      MAX_SOC: 1.0
      MAX_CHARGE_RATE: -100
      MAX_DISCHARGE_RATE: 100
      CHARGING_RAMP_RATE: 5 # the units here are percentage of max charging (or discharging) rate/second (i.e., 2% of max charging rate per second; with the default rate of -100 kW would be 0.02*(-100 kW)/sec = 2 kW/sec)
      DISCHARGING_RAMP_RATE: 5
      PEAK_SCALING_FACTOR: 1.1 # if peak operation values are not specified, this percentage will be used to scale the batteries' normal operating limits to generate peak operation limits
# =============================================================================



# =============================================================================
# Inverter Tripping Parameters
# -----------------------------------------------------------------------------
# Notes:
#   - undervoltage and overvoltage trip settings are based on IEEE 1547-2018 mandatory voltage regions, these can be made more convervative as needed
#   - inverter will instantaneously trip if voltage goes beyond the instant_trip_limit
#   - if voltage goes beyond the ride_through_limit, a timer will start counting down from the clearing_time value
#     - if voltage returns to normal before the timer reaches zero, the timer is reset and inverter remains connected
#     - if timer reaches zero and voltage is still beyond the ride_through_limit, the inverter will trip
#   - once tripped, the inverter will remain off until it's reconnect delay has elapsed
#     - reconnect delays are staggered across inverters, this prevents voltage oscillations due to mass reconnection
#     - actual reconnect delay for each inverter will be randomly selected between the specified min and max values (uniform distribution)
#     - utilities typically set reconnect delay between 300-900 seconds (5-15 minutes) 
#     - 5 minutes is the minimum allowed by IEEE 1547-2018
#   - expected response time for instant_trip_limits (when there is severe under/over voltage) is 0.16 seconds
#   - inverters will only attempt to reconnect when grid conditions are stable for the duration of the reconnect delay
#   - note that the PyMAGIC tripping logic only tests voltage limits, it does not model/consider frequency, current, temperature, or other tripping conditions
# -----------------------------------------------------------------------------
undervoltage:
  instant_trip_limit: 0.45 # instant trip below 0.45 p.u.
  ride_through_limit: 0.88 # ride through timer starts below 0.88 p.u.; inverter trips if voltage remains below this limit after ride through duration
  clearing_time: 2.0 # 2-21 seconds specified by IEEE 1547-2018
overvoltage:
  instant_trip_limit: 1.20 # instant trip above 1.20 p.u.
  ride_through_limit: 1.10 # ride through timer starts above 1.10 p.u.; inverter trips if voltage remains above this limit after ride through duration
  clearing_time: 2.0  # 2-13 seconds specified by IEEE 1547-2018
min_reconnect_delay: 300 # minimum time (in seconds) after which a tripped inverter will attempt to reconnect (5 minutes is the minimum allowed by IEEE 1547-2018)
max_reconnect_delay: 900 # maximum time (in seconds) after which a tripped inverter will attempt to reconnect (if grid conditions are stable)
# =============================================================================



# =============================================================================
# Device Tripping Attack Definitions
# -----------------------------------------------------------------------------
# Notes: 
#   - this attack type forces targeted devices to turn off for a specified duration
#   - hack definitions format (list of length 3): [start_time, end_time, devices]
#     - start_time: (int or None)
#     - end_time: (int or None)
#     - hack_pct: (float between 0 and 1, or None)
#     - devices: (list of device names, int count, float fraction, or None)
#   - can provide multiple such lists to layer attacks as needed
#   - use EITHER option A or option B (option A is recommended for clarity)
#     - option A specifies hacks for a certain device class (i.e., the attack applied to PV inverters can differ from the attack applied to batteries)
#     - option B applies the defined hacks across all devices (i.e., PV and battery inverters that are specified in the attack will both be attacked with the same parameters)
#     - WARNING: if using option B, ensure that the devices being targeted exist in both device classes to avoid errors

# ----------------------------------------------
# Option A: Per-device-class Hacks (Recommended)
# ----------------------------------------------
device_trip_list:
  PV: 
    # - [75, 125, 0.25, ["611c"]]
    # - [100, 150, 0.6, ["675_a"]]


  BSD:
    # - [140, 200, 0.6, ["670_b"]]
    # - [200, 250, 0.6, ["670_a"]]

# -------------------------------------------------------------
# Option B: Global Device Hacks (applies to every device class)
# -------------------------------------------------------------
# device_trip_list:
#   - [60, 80, 0.1, ["611_c"]]
# =============================================================================



# =============================================================================
# VVVW Controller Tripping Attack Definitions
# -----------------------------------------------------------------------------
# Notes: 
#   - this attack type forces VVVW controllers to shut off for a given devices for a specified duration
#     - in the case of a battery, this means that local setpoints will be obeyed without VVVW adjustments (i.e., the battery may perform injections that violate voltage limits)
#     - in the case of a PV inverter, this means that the inverter will provide maximum active power output (subject to solar availability and apparent power limits) with no reactive power support
#   - hack definitions format (list of length 3): [start_time, end_time, devices]
#     - start_time: (int or None)
#     - end_time: (int or None)
#     - hack_pct: (float between 0 and 1, or None)
#     - devices: (list of device names, int count, float fraction, or None)
#   - can provide multiple such lists to layer attacks as needed
#   - use EITHER option A or option B (option A is recommended for clarity)
#     - option A specifies hacks for a certain device class (i.e., the attack applied to PV inverters can differ from the attack applied to batteries)
#     - option B applies the defined hacks across all devices (i.e., PV and battery inverters that are specified in the attack will both be attacked with the same parameters)
#     - WARNING: if using option B, ensure that the devices being targeted exist in both device classes to avoid errors

# ----------------------------------------------
# Option A: Per-device-class Hacks (Recommended)
# ----------------------------------------------
VVVW_trip_list:

  PV: 
    # - [175, 225, 0.25, ["611_c"]]
    # - [100, 150, 0.6, ["675_a", "675_b"]]



  BSD:
    # - [130, 170, 0.60, ["611_c"]]
    # - [200, 250, 0.6, ["670_a", "670_b"]]
    # - [110, 150, 0.60, ["611_c"]]
    # - [140, 180, 0.2, ["611_c"]]
    # - [230, 290, ["611_c"]]

# -------------------------------------------------------------
# Option B: Global Device Hacks (applies to every device class)
# -------------------------------------------------------------
# VVVW_trip_list:
  # - [50, 70, 0.05, ["611_c"]]
# =============================================================================



# =============================================================================
# VVVW Attack Defintions
# -----------------------------------------------------------------------------
# Notes: 
#   - hack definitions format: [start_time, end_time, hack_pct, devices, bp_override]
#     - start_time: (int or None)
#     - end_time: (int or None)
#     - hack_pct: (float between 0 and 1, or None)
#     - devices: (list of device names, int count, float fraction, or None)
#     - bp_override: (list of 5 floats, float offset, or None)
#   - can provide multiple such lists to layer attacks as needed
#   - use EITHER option A or option B (option A is recommended for clarity)
#     - option A specifies hacks for a certain device class (i.e., the attack applied to PV inverters can differ from the attack applied to batteries)
#     - option B applies the defined hacks across all devices (i.e., PV and battery inverters that are specified in the attack will both be attacked with the same parameters)
#     - WARNING: if using option B, ensure that the devices being targeted exist in both device classes to avoid errors

# ----------------------------------------------
# Option A: Per-device-class Hacks (Recommended)
# ----------------------------------------------
VVVW_hack_list:
  PV: 
    # - This is the definition of a voltage imbalance attack for the ieee37 (delta) topology
    #   - Each phase pair attack is staggered because if all three phases are hit at the same time with the same offset then the feeder would remain
    #     balanced
    #   - 60% of each inverters capacity is subject to the attacker's breakpoint offset
    #   - Breakpoints are offset by +0.05
    - [1000, 1133, 0.6, ["701_ab", "714_ab", "718_ab", "729_ab", "733_ab", "737_ab", "738_ab", "742_ab", "744_ab"], 0.05]
    - [1134, 1267, 0.6, ["701_bc", "714_bc", "722_bc", "724_bc", "725_bc", "731_bc", "736_bc", "742_bc"], 0.05]
    - [1268, 1400, 0.6, ["701_ac", "712_ac", "713_ac", "720_ac", "722_ac", "727_ac", "730_ac", "732_ac", "734_ac", "735_ac", "740_ac", "741_ac"], 0.05]


#use this to simulate an imbalance attack on each of the phases (wye/single-phase feeders only; ieee37 is delta -- see note above)
  # - [100, 200, 0.6, 'a', 0.05] #offsets BPs for phase A devices by 0.05 (uses 60% of each device capacity to implement the attack, the other 40% will be unaffected)
  # - [300, 400, 0.6, 'b', 0.05]
  # - [500, 600, 0.6, 'c', 0.05]

# -------------------------------------------------------------
# Option B: Global Device Hacks (applies to every device class)
# -------------------------------------------------------------
# VVVW_hack_list:
#   - [75, 85, 0.3, ["611_c"], 0.3]
  # - [78, 85, 0.4, ["670_a"], 0.4]

# VVVW_hack_list:
#   - [100, 200, 0.3, null, 0.1]
#   - [350, 450, 0.2, null, 0.1]
# =============================================================================



# =============================================================================
# Direct Injection Attack Definitions
# -----------------------------------------------------------------------------
# Notes:
#   - this attack type will inject the specified amount of reactive power (in kVAR) at any node that has a load (not required for an inverter to be present at that node)
#   - hack definitions format (list of length 4): [start_time, end_time, reactive_power_to_inject (in kVAR), devices]
injection_list:
  # - [100, 110, 50, ["611_c"]]
  # - [120, 160, 50, ["611_c"]]
# =============================================================================



# =============================================================================
# Adaptive Controller Parameters
# -----------------------------------------------------------------------------
use_attack_flag: true
adaptive_controller_on: false
adaptive_controller_params:
  gain: 500  # Gain parameter for adaptive breakpoint computation
  delay_timer: 1 # Delay (in seconds) before adaptive controller starts adjusting breakpoints
  threshold: 0.5 # Threshold for triggering breakpoint adjustments
  high_pass_filter: 1 # High-pass filter coefficient
  energy_factor: 1e6 # Scaling factor for energy term (ε)
  sliding_window: 10 # Window size for computing y (average of recent ε values)

save_nodes:
  - # 611_c
# =============================================================================



# =============================================================================
# normal_runthrough.py Script Parameters (for testing a policy)
# -----------------------------------------------------------------------------
theta: null #input the policy iteration (as an int) to indidate which policy you would like to simulate
  # the best policy is taken by default

timestamp: null #input the name of the timestamped folder (as a str) that the policy is located in 
  # the most recent training folder is taken by default
# =============================================================================



# =============================================================================
# Logging Parameters
# -----------------------------------------------------------------------------
log_pv_data: true #set to true to save internal injection CSV files
log_bsd_data: true #set to true to save CSV files of internal battery states, CSV files will be saved per segment (segment 0 always represents the uncompromised portion of the device while any other segments represent compromised portions)
  # - current internal battery states include: SOC, active power injections, ramp rate limits, apparent power limits, SOC limits, energy capacity, energy level, etc.
save_logs: true #set to true to save all published information to the logger (will generate a folder of logs at the end of every experiment)
# =============================================================================



# =============================================================================
# Debugging Parameters
# -----------------------------------------------------------------------------
# Notes:
#  - this feature is generally meant for developers to help test if variables are behaving as expected
#  - a lot of information may be printed to the console - only uncomment relevant debug statements
#  - currently only one node at a time can be debugged, this is to avoid printing too much information to the console
#  - feel free to add additional debug statements throughout the code base as necessary with the following headers for the block:
#   >>>>>>>>>>>>>>>>>>>>>>>>> Debugging Block <<<<<<<<<<<<<<<<<<<<<<<<<
# if debug and node == debug_node and current_time in debug_times:
#     print statement to debug as needed
#   >>>>>>>>>>>>>>>>>>>>>>>>> End Debug Block <<<<<<<<<<<<<<<<<<<<<<<<<

debug: true
debug_node: "701_ab"
debug_times: [2, 3]
# =============================================================================