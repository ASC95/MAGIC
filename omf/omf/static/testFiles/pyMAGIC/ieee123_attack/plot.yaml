# =============================================================================
# Per Node Figure Generation
# -----------------------------------------------------------------------------
# Notes:
#   - set 'plot' to true for the plots you want to view interactively
#   - set 'save' to true for the plots you want to save as figures in the outputs folder
#   - nodes_to_plot: list of node IDs to generate per-node plots for
#  - include_warmup: bool - whether to include the warmup period in the plots
#   - 'bsd_power_per_node', 'bsd_SOC_per_node', and 'bsd_energy_per_node' are all currently saved in outputs/simulation/figures/per_node_figures under a timestamped folder corresponding to when the experiment was started

per_node_figure_defaults: &per_node_figure_default
  plot: false
  save: false
  nodes_to_plot:
    - '670_a'
    - '670_b'
    - '611_c'
  # save_as_subplots: false #TODO (not yet implemented)
  include_warmup: false # include warmup period in the plot, recommended to leave out
  include_limits: false # include limits that show phsyical battery constraints (e.g., show SOC limits for `bsd_SOC_per_node`)
  label_attack_type: true   
  figure_size: [15, 7] # --- base figure size (width, height) in inches ---

per_node_figures:
  bsd_power_per_node:
      <<: *per_node_figure_default
      # save: true
  bsd_SOC_per_node:
      <<: *per_node_figure_default
      # save: true
  bsd_energy_per_node:
      <<: *per_node_figure_default
      # save: true
# =============================================================================


