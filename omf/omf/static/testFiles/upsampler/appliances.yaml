# - Per-appliance definitions for loadshape_upsampling
#       source                      rae (1-second, house 1 or 2)
#       house / channels            which house and which power_blk 
#       start_w / end_w             thresholds in watts
#       min_seconds / max_seconds   duration range 
#       max_w                       drop events containing any sample above this 
#       weight                      relative draw probability during placement
#       num_instances               how many copies may run at once in one composed load (e.g. a physical house has 1 dryer)
#       amplitude_jitter            each placed copy is scaled by uniform(1-j, 1+j) so repeats are not identical
#       valid_daily_windows         list of ["HH:MM", "HH:MM"] pairs the event must start AND end inside (empty = always)
#       valid_seasons               list of ["MM-DD", "MM-DD"] pairs the event must start inside (empty = all year)
#   - Ranges
#       start_w                     min: end_w 
#                                   max: peak load
#       end_w                       min: 0 
#                                   max: start_w
#       min_seconds                 min: min power consumption length
#                                   max: max_seconds
#       max_seconds                 min: min_seconds
#                                   max: no max 
#       max_w                       min: start_w 
#                                   max: no max
#       weight                      min: > 0 
#                                   max: no max
#       num_instances               min: 1
#                                   max: 255 
#       amplitude_jitter            min: 0.0 
#                                   max: < 1.0
#   - RAE watt levels were chosen from typical appliance ratings and the RAE panel labels.
#     Run train.py and eyeball the printed length/peak stats (and --plot timelines) when tuning

# ---- RAE house 1 (1-second) - the default library for 1-second output ----

heat_pump:
  source: rae
  house: 1
  channels: [sub13, sub14]
  start_w: 300
  end_w: 150
